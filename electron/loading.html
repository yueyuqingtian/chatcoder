<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  /* ── plan-308-1555 M7：开屏改为"半透明玻璃"风格 ──
     用户要求：把 zcode 的半透明做法用到本软件的开屏动画上，
     只在用户开启毛玻璃效果时生效（glass off 时保持原来的纯色不透明）。
     实现分层：
       * 系统层：主进程窗口 transparent + ACCENT/acrylic（由 main.cjs 施加，本页无需处理）
       * 样式层：本页背景透明 + 玻璃高光/内描边（模拟液态质感）
       * 动画层：整页淡入（opacity 0→1），避免"啪"地跳出 */
  html { background: transparent; }
  body {
    background: transparent; color: #e4e6eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1);
  }
  body.ready { opacity: 1; }

  /* glass off：纯色不透明开屏（保持原有观感，不做透明渗色） */
  body.solid {
    background: #16181d;
    opacity: 1;
    transition: none;
  }
  body.solid.light { background: #f2f3f7; color: #23262e; }

  /* glass on：**平坦**的低透明底（与左面板同色系、同 alpha 区间）。
     plan-26-126 M6（去波浪感）——删除三样造成"波浪 / 斜纹"的东西：
       * 150° 对角渐变高光：大面积亮带随桌面明暗起伏，是波浪感的主因；
       * 顶部 `inset 0 1px 0` 白色高光：在纯色底上多出一条横线；
       * `saturate(1.5)` 重饱和：让渗入的壁纸色更脏。
     模糊只保留极轻一档，且**仅在系统材质不可用时**启用（mat=0）；有系统材质时
     交给 DWM（acrylic / ACCENT / vibrancy）做高斯模糊，页面不再叠加。 */
  body.glass {
    background: rgba(20, 22, 27, 0.90);
  }
  body.glass.light {
    background: rgba(242, 243, 247, 0.92);
    color: #23262e;
  }
  /* mat=0（无系统模糊材质）：用轻量 backdrop-filter 兜底，保持"轻微模糊"而非重度磨砂 */
  body.glass.mat-fallback {
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .logo { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 26px; }
  .logo svg { display: block; filter: drop-shadow(0 6px 18px rgba(90, 60, 220, 0.35)); }
  .logo-name {
    font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  body.light .spinner {
    border-color: rgba(30, 34, 60, 0.12);
    /* 上面的 border-color 简写会连 top 一起覆盖成轨道灰，导致四边同色、
       spin 动画虽在跑但视觉完全不可见；必须显式补回 accent 弧光 */
    border-top-color: #6366f1;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text { margin-top: 16px; font-size: 13px; color: #8b8fa3; }
  body.light .text { color: #6b7080; }
</style>
</head>
<body>
  <div class="logo">
    <!-- 应用图标（与 electron/build/icon.png 同设计）：渐变圆角方块 + 对话气泡 + </> -->
    <svg width="72" height="72" viewBox="0 0 512 512" fill="none" aria-label="chatcoder">
      <defs>
        <linearGradient id="cc-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
          <stop stop-color="#1B2552"/>
          <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="115" fill="url(#cc-grad)"/>
      <rect x="128" y="138" width="256" height="180" rx="46" stroke="#fff" stroke-width="22"/>
      <path d="M206 314 L168 372 L262 314 Z" fill="#fff"/>
      <path d="M186 228 L218 204 M186 228 L218 252 M272 194 L240 262 M326 228 L294 204 M326 228 L294 252"
            stroke="#fff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="logo-name">chatcoder</div>
  </div>
  <div class="spinner"></div>
  <div class="text" id="msg">正在启动服务…</div>
  <script>
    // 主进程通过 query 注入：theme=light|dark（主题）、glass=1|0（是否开启毛玻璃）
    (function () {
      try {
        var q = new URLSearchParams(location.search);
        var theme = q.get("theme");
        var dark = theme ? theme !== "light" : !window.matchMedia("(prefers-color-scheme: light)").matches;
        if (!dark) document.body.classList.add("light");
        // 毛玻璃开启时用玻璃样式（轻微半透明 + 露出下层系统材质），否则纯色不透明
        var glass = q.get("glass") === "1";
        document.body.classList.add(glass ? "glass" : "solid");
        // plan-26-126 M6：只有系统没有可用模糊材质（mat=0）时才叠轻量 backdrop-filter 兜底
        if (glass && q.get("mat") === "0") document.body.classList.add("mat-fallback");
        // 下一帧再置 ready，触发淡入过渡（避免与首帧绘制同帧导致动画被跳过）
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { document.body.classList.add("ready"); });
        });
      } catch (e) {
        document.body.classList.add("solid");
      }
    })();
    window.__chatcoderLoading = { update: function(text) { document.getElementById('msg').textContent = text; } };
  </script>
</body>
</html>
