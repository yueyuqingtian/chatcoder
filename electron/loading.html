<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  /* 深浅色双主题：默认深色，body.light 切换浅色（主题由主进程按用户偏好/系统注入） */
  body {
    background: #16181d; color: #e4e6eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  body.light { background: #f2f3f7; color: #23262e; }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 26px; }
  .logo svg { display: block; filter: drop-shadow(0 6px 18px rgba(90, 60, 220, 0.35)); }
  .logo-name {
    font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  body.light .spinner {
    border-color: rgba(30, 34, 60, 0.12);
    /* 上面的 border-color 简写会连 top 一起覆盖成轨道灰，导致四边同色、
       spin 动画虽在跑但视觉完全不可见；必须显式补回 accent 弧光 */
    border-top-color: #6366f1;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text { margin-top: 16px; font-size: 13px; color: #8b8fa3; }
  body.light .text { color: #6b7080; }
</style>
</head>
<body>
  <div class="logo">
    <!-- 应用图标（与 electron/build/icon.png 同设计）：渐变圆角方块 + 对话气泡 + </> -->
    <svg width="72" height="72" viewBox="0 0 512 512" fill="none" aria-label="chatcoder">
      <defs>
        <linearGradient id="cc-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
          <stop stop-color="#1B2552"/>
          <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="115" fill="url(#cc-grad)"/>
      <rect x="128" y="138" width="256" height="180" rx="46" stroke="#fff" stroke-width="22"/>
      <path d="M206 314 L168 372 L262 314 Z" fill="#fff"/>
      <path d="M186 228 L218 204 M186 228 L218 252 M272 194 L240 262 M326 228 L294 204 M326 228 L294 252"
            stroke="#fff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="logo-name">chatcoder</div>
  </div>
  <div class="spinner"></div>
  <div class="text" id="msg">正在启动服务…</div>
  <script>
    // 主进程通过 query 注入主题偏好（light/dark），未传时跟随系统
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var dark = q ? q !== "light" : !window.matchMedia("(prefers-color-scheme: light)").matches;
        if (!dark) document.body.classList.add("light");
      } catch (e) { /* 保持默认深色 */ }
    })();
    window.__chatcoderLoading = { update: function(text) { document.getElementById('msg').textContent = text; } };
  </script>
</body>
</html>
