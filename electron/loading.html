<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #16181d; color: #e4e6eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .logo {
    font-size: 28px; font-weight: 700;
    letter-spacing: -0.5px; margin-bottom: 24px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text { margin-top: 16px; font-size: 13px; color: #8b8fa3; }
</style>
</head>
<body>
  <div class="logo">chatcoder</div>
  <div class="spinner"></div>
  <div class="text" id="msg">正在启动服务…</div>
  <script>
    window.__chatcoderLoading = { update: function(text) { document.getElementById('msg').textContent = text; } };
  </script>
</body>
</html>
